<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Tag Manager -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KMMFFKRS89"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WNE2V5QXER');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://chesstools.org/chesstools.svg" type="image/svg+xml" sizes="any">
    <title>{% block title %}CFC Rating Processor - ChessTools{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('chesstools_ui_assets', filename='theme.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('chesstools_ui_assets', filename='tailwind-shell.js') }}"></script>
</head>
<body class="bg-background text-foreground antialiased flex min-h-screen flex-col">
    {% include 'chesstools/nav.html' %}
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>
    {% include 'chesstools/footer.html' %}
    <script src="{{ url_for('chesstools_ui_assets', filename='shell.js') }}" defer></script>
</body>
</html>
